<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Geometry Dash Style Game</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  overflow: hidden;
  background: #111;
  font-family: Arial, sans-serif;
  color: white;
}

canvas {
  display: block;
  background: linear-gradient(#111b35, #172447);
}

#ui {
  position: fixed;
  top: 15px;
  left: 20px;
  z-index: 5;
  font-size: 20px;
  font-weight: bold;
  text-shadow: 2px 2px #000;
}

#menu {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  background: rgba(0,0,0,.75);
  text-align: center;
}

#menu h1 {
  font-size: 50px;
  margin: 0 0 15px;
}

#menu p {
  font-size: 18px;
}

button {
  margin-top: 20px;
  padding: 14px 35px;
  font-size: 20px;
  font-weight: bold;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="ui">
  Score: <span id="score">0</span>
  <span id="mode"></span>
</div>

<div id="menu">
  <h1>GEOMETRY DASH</h1>
  <p>SPACE / CLICK / TAP to jump</p>
  <p>In BALL mode, press to flip gravity</p>
  <button id="start">PLAY</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreText = document.getElementById("score");
const modeText = document.getElementById("mode");
const menu = document.getElementById("menu");
const startButton = document.getElementById("start");

let W, H;
let groundY;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  groundY = H - 100;
}

window.addEventListener("resize", resize);
resize();

/* =========================
   PLAYER
========================= */

const player = {
  x: 150,
  y: 0,
  size: 42,
  vy: 0,
  gravity: 1,
  grounded: false,
  mode: "cube",
  rotation: 0
};

const physics = {
  gravity: 2100,
  jump: 760,
  ballGravity: 1500,
  ballFlip: 650
};

/* =========================
   GAME
========================= */

let playing = false;
let dead = false;
let cameraX = 0;
let lastTime = 0;
let speed = 430;

/* =========================
   LEVEL
========================= */

const level = [

  /* ---- CUBE SECTION ---- */

  // 1 spike
  {type:"spike", x:650, y:0, w:45, h:45},

  // 2 spikes
  {type:"spike", x:850, y:0, w:45, h:45},
  {type:"spike", x:895, y:0, w:45, h:45},

  // Rectangle platform
  {type:"block", x:1100, y:-100, w:300, h:100},

  // 2 spikes on platform
  {type:"spike", x:1250, y:-145, w:45, h:45},
  {type:"spike", x:1295, y:-145, w:45, h:45},

  // Orb
  {type:"orb", x:1550, y:-190},

  // 8 spikes underneath orb
  {type:"spike", x:1450, y:0, w:45, h:45},
  {type:"spike", x:1495, y:0, w:45, h:45},
  {type:"spike", x:1540, y:0, w:45, h:45},
  {type:"spike", x:1585, y:0, w:45, h:45},
  {type:"spike", x:1630, y:0, w:45, h:45},
  {type:"spike", x:1675, y:0, w:45, h:45},
  {type:"spike", x:1720, y:0, w:45, h:45},
  {type:"spike", x:1765, y:0, w:45, h:45},

  /* ---- BALL PORTAL ---- */

  {type:"portal", x:1950, mode:"ball"},

  /* ---- BALL SECTION ---- */

  // Ceiling platform
  {type:"ceiling", x:2150, y:0, w:900, h:55},

  // Ceiling spikes
  {type:"ceilingSpike", x:2300, y:55, w:45, h:45},
  {type:"ceilingSpike", x:2345, y:55, w:45, h:45},
  {type:"ceilingSpike", x:2500, y:55, w:45, h:45},
  {type:"ceilingSpike", x:2545, y:55, w:45, h:45},

  // Platform for ball
  {type:"block", x:2250, y:-180, w:260, h:35},

  // More platforms for up/down movement
  {type:"block", x:2600, y:-350, w:250, h:35},
  {type:"block", x:2950, y:-180, w:250, h:35},

  // Ball path markers
  {type:"marker", x:2400, y:-250},
  {type:"marker", x:2750, y:-430},
  {type:"marker", x:3100, y:-250},

  /* ---- CUBE PORTAL ---- */

  {type:"portal", x:3350, mode:"cube"},

  /* ---- FINAL CUBE SECTION ---- */

  {type:"spike", x:3600, y:0, w:45, h:45},

  {type:"finish", x:4000}
];

/* =========================
   INPUT
========================= */

function input() {

  if (!playing) return;

  if (player.mode === "ball") {
    player.gravity *= -1;
    player.vy = physics.ballFlip * player.gravity;
    return;
  }

  if (player.grounded) {
    player.vy = -physics.jump;
    player.grounded = false;
  }

  // Activate nearby orb
  for (const o of level) {

    if (o.type !== "orb") continue;

    const worldX = o.x;

    if (
      Math.abs((cameraX + player.x) - worldX) < 65 &&
      Math.abs(player.y - (groundY + o.y)) < 110
    ) {
      player.vy = -900;
    }
  }
}

window.addEventListener("keydown", e => {
  if (
    e.code === "Space" ||
    e.code === "ArrowUp" ||
    e.code === "KeyW"
  ) {
    e.preventDefault();
    input();
  }
});

window.addEventListener("mousedown", input);
window.addEventListener("touchstart", input, {passive:true});

/* =========================
   START / RESTART
========================= */

startButton.onclick = () => {
  startGame();
};

function startGame() {

  menu.style.display = "none";

  playing = true;
  dead = false;

  cameraX = 0;

  player.y = groundY - player.size;
  player.vy = 0;
  player.gravity = 1;
  player.grounded = true;
  player.mode = "cube";
  player.rotation = 0;

  modeText.textContent = " • CUBE";

  lastTime = performance.now();

  requestAnimationFrame(gameLoop);
}

function die() {

  if (dead) return;

  dead = true;
  playing = false;

  setTimeout(() => {

    menu.style.display = "flex";

    menu.querySelector("h1").textContent = "TRY AGAIN";

    startButton.textContent = "RESTART";

  }, 400);
}

/* =========================
   UPDATE
========================= */

function update(dt) {

  cameraX += speed * dt;

  const worldX = cameraX + player.x;

  /* =====================
     CUBE
  ===================== */

  if (player.mode === "cube") {

    player.vy += physics.gravity * dt;
    player.y += player.vy * dt;

    player.grounded = false;

    // Ground
    if (player.y + player.size >= groundY) {

      player.y = groundY - player.size;
      player.vy = 0;
      player.grounded = true;
    }

    // Blocks
    for (const o of level) {

      if (o.type !== "block") continue;

      const bx = o.x - cameraX;
      const by = groundY + o.y;

      const horizontal =
        player.x + player.size > bx &&
        player.x < bx + o.w;

      const landing =
        player.y + player.size <= by + 20 &&
        player.y + player.size + player.vy * dt >= by;

      if (horizontal && landing && player.vy >= 0) {

        player.y = by - player.size;
        player.vy = 0;
        player.grounded = true;
      }
    }

    // Spikes
    for (const o of level) {

      if (o.type !== "spike") continue;

      const sx = o.x - cameraX;
      const sy = groundY + o.y - o.h;

      if (
        player.x + player.size - 8 > sx &&
        player.x + 8 < sx + o.w &&
        player.y + player.size - 8 > sy
      ) {
        die();
      }
    }

    // Portal
    for (const o of level) {

      if (o.type !== "portal") continue;

      const px = o.x - cameraX;

      if (
        Math.abs(player.x + player.size / 2 - px) < 30
      ) {

        if (o.mode === "ball") {

          player.mode = "ball";
          player.gravity = 1;
          player.vy = 0;

          modeText.textContent = " • BALL";
        }
      }
    }

    player.rotation += player.vy * dt * 0.002;
  }

  /* =====================
     BALL
  ===================== */

  else {

    player.vy += physics.ballGravity * player.gravity * dt;
    player.y += player.vy * dt;

    let landed = false;

    // Ground
    if (
      player.gravity === 1 &&
      player.y + player.size >= groundY
    ) {

      player.y = groundY - player.size;
      player.vy = 0;
      landed = true;
    }

    // Ceiling
    if (
      player.gravity === -1 &&
      player.y <= 55
    ) {

      player.y = 55;
      player.vy = 0;
      landed = true;
    }

    // Platforms
    for (const o of level) {

      if (o.type !== "block") continue;

      const bx = o.x - cameraX;
      const by = groundY + o.y;

      const horizontal =
        player.x + player.size > bx &&
        player.x < bx + o.w;

      // Falling onto platform
      if (
        player.gravity === 1 &&
        horizontal &&
        player.y + player.size <= by + 20 &&
        player.y + player.size + player.vy * dt >= by
      ) {

        player.y = by - player.size;
        player.vy = 0;
        landed = true;
      }

      // Falling upward onto underside
      if (
        player.gravity === -1 &&
        horizontal &&
        player.y >= by + o.h - 20 &&
        player.y + player.vy * dt <= by + o.h
      ) {

        player.y = by + o.h;
        player.vy = 0;
        landed = true;
      }
    }

    // Ceiling spikes
    for (const o of level) {

      if (o.type !== "ceilingSpike") continue;

      const sx = o.x - cameraX;
      const sy = o.y;

      if (
        player.x + player.size - 8 > sx &&
        player.x + 8 < sx + o.w &&
        player.y < sy + o.h &&
        player.y + player.size > sy
      ) {
        die();
      }
    }

    // Normal spikes still kill ball
    for (const o of level) {

      if (o.type !== "spike") continue;

      const sx = o.x - cameraX;
      const sy = groundY + o.y - o.h;

      if (
        player.x + player.size - 8 > sx &&
        player.x + 8 < sx + o.w &&
        player.y + player.size - 8 > sy
      ) {
        die();
      }
    }

    // Cube portal
    for (const o of level) {

      if (o.type !== "portal") continue;

      const px = o.x - cameraX;

      if (
        Math.abs(player.x + player.size / 2 - px) < 30 &&
        o.mode === "cube"
      ) {

        player.mode = "cube";
        player.gravity = 1;
        player.vy = 0;

        player.y = Math.min(
          player.y,
          groundY - player.size
        );

        modeText.textContent = " • CUBE";
      }
    }

    player.rotation += 0.15 * player.gravity;
  }

  // Finish
  for (const o of level) {

    if (o.type !== "finish") continue;

    if (worldX >= o.x) {

      playing = false;

      menu.style.display = "flex";
      menu.querySelector("h1").textContent = "LEVEL COMPLETE!";
      startButton.textContent = "PLAY AGAIN";
    }
  }

  // Fell off screen
  if (player.y > H + 200 || player.y < -300) {
    die();
  }

  scoreText.textContent = Math.floor(cameraX / 10);
}

/* =========================
   DRAW
========================= */

function drawBackground() {

  ctx.fillStyle = "#111b35";
  ctx.fillRect(0,0,W,H);

  ctx.strokeStyle = "rgba(255,255,255,.05)";
  ctx.lineWidth = 1;

  const grid = 50;

  for (let x = -(cameraX % grid); x < W; x += grid) {

    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,H);
    ctx.stroke();
  }

  for (let y = 0; y < H; y += grid) {

    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();
  }
}

function drawGround() {

  ctx.fillStyle = "#18213d";
  ctx.fillRect(0,groundY,W,H-groundY);

  ctx.fillStyle = "#35d7ff";
  ctx.fillRect(0,groundY,W,5);
}

function drawBlock(o) {

  const x = o.x - cameraX;
  const y = groundY + o.y;

  ctx.fillStyle = "#2979ff";
  ctx.fillRect(x,y,o.w,o.h);

  ctx.strokeStyle = "#8ee7ff";
  ctx.lineWidth = 3;
  ctx.strokeRect(x,y,o.w,o.h);
}

function drawSpike(o) {

  const x = o.x - cameraX;
  const base = groundY + o.y;

  ctx.fillStyle = "#ff3b68";

  ctx.beginPath();

  ctx.moveTo(x,base);
  ctx.lineTo(x + o.w/2,base - o.h);
  ctx.lineTo(x + o.w,base);

  ctx.closePath();
  ctx.fill();
}

function drawCeilingSpike(o) {

  const x = o.x - cameraX;

  ctx.fillStyle = "#ff3b68";

  ctx.beginPath();

  ctx.moveTo(x,o.y);
  ctx.lineTo(x + o.w/2,o.y + o.h);
  ctx.lineTo(x + o.w,o.y);

  ctx.closePath();

  ctx.fill();
}

function drawOrb(o) {

  const x = o.x - cameraX;
  const y = groundY + o.y;

  ctx.beginPath();
  ctx.arc(x,y,19,0,Math.PI*2);

  ctx.fillStyle = "#ffd633";
  ctx.fill();

  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(x,y,9,0,Math.PI*2);

  ctx.fillStyle = "#fff";
  ctx.fill();
}

function drawPortal(o) {

  const x = o.x - cameraX;

  ctx.beginPath();
  ctx.arc(x,groundY - 80,38,0,Math.PI*2);

  ctx.fillStyle =
    o.mode === "ball"
      ? "rgba(255,210,50,.35)"
      : "rgba(50,255,255,.35)";

  ctx.fill();

  ctx.strokeStyle =
    o.mode === "ball"
      ? "#ffd633"
      : "#36ffff";

  ctx.lineWidth = 7;
  ctx.stroke();

  ctx.fillStyle = "#fff";
  ctx.font = "bold 13px Arial";
  ctx.textAlign = "center";

  ctx.fillText(
    o.mode === "ball" ? "BALL" : "CUBE",
    x,
    groundY - 125
  );
}

function drawCeiling(o) {

  const x = o.x - cameraX;

  ctx.fillStyle = "#18213d";
  ctx.fillRect(x,0,o.w,o.h);

  ctx.fillStyle = "#35d7ff";
  ctx.fillRect(x,o.h-4,o.w,4);
}

function drawPlayer() {

  ctx.save();

  const cx = player.x + player.size/2;
  const cy = player.y + player.size/2;

  ctx.translate(cx,cy);
  ctx.rotate(player.rotation);

  if (player.mode === "cube") {

    ctx.fillStyle = "#42e8ff";
    ctx.fillRect(
      -player.size/2,
      -player.size/2,
      player.size,
      player.size
    );

    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 3;
    ctx.strokeRect(
      -player.size/2,
      -player.size/2,
      player.size,
      player.size
    );

  } else {

    ctx.beginPath();
    ctx.arc(
      0,
      0,
      player.size/2,
      0,
      Math.PI*2
    );

    ctx.fillStyle = "#ffd633";
    ctx.fill();

    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-10,-5);
    ctx.lineTo(10,5);
    ctx.stroke();
  }

  ctx.restore();
}

function draw() {

  drawBackground();
  drawGround();

  for (const o of level) {

    if (o.type === "block")
      drawBlock(o);

    if (o.type === "spike")
      drawSpike(o);

    if (o.type === "ceiling")
      drawCeiling(o);

    if (o.type === "ceilingSpike")
      drawCeilingSpike(o);

    if (o.type === "orb")
      drawOrb(o);

    if (o.type === "portal")
      drawPortal(o);
  }

  drawPlayer();
}

/* =========================
   GAME LOOP
========================= */

function gameLoop(time) {

  if (!playing) {
    draw();
    return;
  }

  const dt = Math.min(
    (time - lastTime) / 1000,
    0.033
  );

  lastTime = time;

  update(dt);
  draw();

  requestAnimationFrame(gameLoop);
}

draw();
</script>

</body>
</html>
